    <script>(() => {
  // src/game.js
  function letterLabel(index) {
    let value = index + 1;
    let label = "";
    while (value > 0) {
      value--;
      label = String.fromCharCode(65 + value % 26) + label;
      value = Math.floor(value / 26);
    }
    return label;
  }
  function shuffle(items) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }
  function makeSequence(mode, size) {
    const count = size * size;
    if (mode === "letters") return Array.from({ length: count }, (_, i) => ({ id: "letter-".concat(i), value: letterLabel(i), color: "plain" }));
    if (mode === "desc") return Array.from({ length: count }, (_, i) => ({ id: "number-".concat(count - i), value: count - i, color: "plain" }));
    if (mode === "alternate") {
      let red = 1;
      let blue = Math.floor(count / 2);
      return Array.from({ length: count }, (_, i) => i % 2 === 0 ? { id: "red-".concat(red), value: red++, color: "red" } : { id: "blue-".concat(blue), value: blue--, color: "blue" });
    }
    return Array.from({ length: count }, (_, i) => ({ id: "number-".concat(i + 1), value: i + 1, color: "plain" }));
  }
  function getNextTarget(sequence, index) {
    var _a;
    return (_a = sequence[index]) != null ? _a : null;
  }
  function formatTime(ms) {
    const tenths = Math.floor(Math.max(0, ms) / 100);
    const minutes = Math.floor(tenths / 600);
    const seconds = Math.floor(tenths % 600 / 10);
    return "".concat(String(minutes).padStart(2, "0"), ":").concat(String(seconds).padStart(2, "0"), ".").concat(tenths % 10);
  }
